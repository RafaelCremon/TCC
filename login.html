<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tela de Login</title>
  <link rel="stylesheet" href="css/login.css" />
  <style>
    /* Fade-in suave para o card de login */
    .card.login-animate-in {
      animation: loginFadeIn 0.7s cubic-bezier(.4,1.4,.6,1);
    }
    @keyframes loginFadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  /* Removidas animações Apple-style, mantida apenas a animação de entrada do card */

    /* Modo escuro */
    body.dark-mode {
      background:
        url('assets/imagens/FUNDO.png') center center repeat,
        linear-gradient(135deg, #181c2f 0%, #232a45 100%);
      color: #f3f3f3;
    }
    body.dark-mode .card {
      background: #232a45;
      color: #f3f3f3;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    body.dark-mode .card-head h1,
    body.dark-mode .card-head p.sub {
      color: #f3f3f3;
    }
    body.dark-mode .campo label {
      color: #bfc8e2;
    }
    body.dark-mode .campo input {
      background: #181c2f;
      color: #f3f3f3;
      border: 1px solid #3a4266;
    }
    body.dark-mode .campo input::placeholder {
      color: #8a94b8;
    }
    body.dark-mode .mensagem-erro {
      color: #ff6b6b;
    }
    body.dark-mode .logo {
      /* Removido filter: invert(1); */
      background: url('assets/imagens/FUNDO.png') center center no-repeat;
      background-size: cover;
    }
    body:not(.dark-mode) .logo {
      filter: none;
      background: #fff;
    }
    /* Botão de alternância de tema */
    .theme-toggle-btn {
      position: fixed;
      right: 32px;
      bottom: 32px;
      z-index: 100;
      background: #fff;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      box-shadow: 0 2px 8px rgba(44,92,255,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s;
      padding: 0;
    }
    .theme-toggle-btn img {
      width: 28px;
      height: 28px;
      pointer-events: none;
    }
    .theme-toggle-btn:hover {
      background: #e3e7fa;
    }
    body.dark-mode .theme-toggle-btn {
      background: #232a45;
    }
    body.dark-mode .theme-toggle-btn:hover {
      background: #181c2f;
    }
    body.dark-mode #senhaIcon,
    body.dark-mode #themeIcon {
      filter: invert(1) drop-shadow(0 1px 2px rgba(44,92,255,0.10));
    }
    body:not(.dark-mode) #senhaIcon,
    body:not(.dark-mode) #themeIcon {
      filter: drop-shadow(0 1px 2px rgba(44,92,255,0.10));
    }
  </style>
</head>
<body>
  <!-- Carregar tema salvo -->
  <script>
    // Aplicar tema salvo imediatamente para evitar flash
    if (localStorage.getItem('darkMode') === 'enabled') {
      document.body.classList.add('dark-mode');
    }
  </script>
  
  <!-- Card de login -->
  <div class="card" id="loginCard" style="padding:32px 32px 24px 32px; margin-top:40px;">
    <div class="card-head">
      <img src="assets/imagens/LOGOSEMFUNDO.png"
           alt="Logo Quantum Education"
           class="logo"
           id="logoImg"
           style="width:180px;height:auto;margin-bottom:10px;box-shadow:0 2px 8px rgba(44,92,255,0.10);border-radius:12px;padding:12px;">
      <h1>Login</h1>
      <p class="sub">Acesse sua conta</p>
    </div>

    <!-- Campo do Usuário -->
    <div class="campo">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" placeholder="Digite seu usuário" />
      <div class="mensagem-erro" id="erroUsuario"></div>
    </div>

    <!-- Campo da Senha -->
    <div class="campo pwd-wrap">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" />
      <span class="toggle-senha" id="toggleSenhaBtn" style="display:flex;align-items:center;cursor:pointer;">
  <img id="senhaIcon" src="assets/imagens/OLHO.jpg" alt="Mostrar/Ocultar Senha" style="width:22px;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(44,92,255,0.10));">
      </span>
      <div class="mensagem-erro" id="erroSenha"></div>
    </div>

    <!-- Botão entrar -->
    <button onclick="login()">Entrar</button>
    
    <!-- Painel de credenciais para teste -->
    <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px;">
      <p style="margin: 0 0 10px 0; font-weight: 600; color: #374151;">🔐 Credenciais de Teste:</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px;">
        <div style="padding: 6px; background: white; border-radius: 4px; text-align: center; cursor: pointer;" onclick="fillCredentials('admin', 'admin123')">
          <strong>Admin</strong><br>admin / admin123
        </div>
        <div style="padding: 6px; background: white; border-radius: 4px; text-align: center; cursor: pointer;" onclick="fillCredentials('maria.prof', 'prof123')">
          <strong>Prof</strong><br>maria.prof / prof123
        </div>
        <div style="padding: 6px; background: white; border-radius: 4px; text-align: center; cursor: pointer;" onclick="fillCredentials('joao.aluno', 'aluno123')">
          <strong>Aluno</strong><br>joao.aluno / aluno123
        </div>
      </div>
      <p style="margin: 8px 0 0 0; font-size: 10px; color: #6b7280;">Clique em um cartão para preencher automaticamente</p>
    </div>
  </div>
  
  <!-- Botão de alternância de tema -->
  <button class="theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Alternar tema">
    <img id="themeIcon" src="assets/imagens/moon.png" alt="Modo escuro">
  </button>
  
  <!-- Conexão JavaScript -->
  <script src="js/login.js"></script>
  <script>
    // Função para preencher credenciais automaticamente
    function fillCredentials(username, password) {
      document.getElementById('usuario').value = username;
      document.getElementById('senha').value = password;
      
      // Limpar erros
      document.getElementById('erroUsuario').textContent = '';
      document.getElementById('erroSenha').textContent = '';
      
      // Destacar visualmente
      const usuarioInput = document.getElementById('usuario');
      const senhaInput = document.getElementById('senha');
      usuarioInput.style.background = '#e0f2fe';
      senhaInput.style.background = '#e0f2fe';
      
      setTimeout(() => {
        usuarioInput.style.background = '';
        senhaInput.style.background = '';
      }, 1000);
    }

    // Alternância do ícone de senha
    window.addEventListener('DOMContentLoaded', function() {
      var senhaInput = document.getElementById('senha');
      var senhaIcon = document.getElementById('senhaIcon');
      var toggleBtn = document.getElementById('toggleSenhaBtn');
      if (senhaInput && senhaIcon && toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          if (senhaInput.type === 'password') {
            senhaInput.type = 'text';
            if (document.body.classList.contains('dark-mode')) {
              senhaIcon.src = 'assets/imagens/FECHADOESCURO.png';
              senhaIcon.style.filter = 'invert(1)';
            } else {
              senhaIcon.src = 'assets/imagens/FECHADO.jpg';
              senhaIcon.style.filter = '';
            }
            senhaIcon.alt = 'Senha visível';
          } else {
            senhaInput.type = 'password';
            if (document.body.classList.contains('dark-mode')) {
              senhaIcon.src = 'assets/imagens/OLHOESCURO.png';
              senhaIcon.style.filter = 'invert(1)';
            } else {
              senhaIcon.src = 'assets/imagens/OLHO.jpg';
              senhaIcon.style.filter = '';
            }
            senhaIcon.alt = 'Senha oculta';
          }
        });
      }
      // Animação de entrada do card de login
      var card = document.getElementById('loginCard');
      if(card) {
        card.classList.add('login-animate-in');
      }
    });

    // Alternância de tema claro/escuro e troca da logo
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const logoImg = document.getElementById('logoImg');
    function setTheme(dark) {
      if (dark) {
        document.body.classList.add('dark-mode');
        themeIcon.src = 'assets/imagens/sun.png'; // Ícone de sol no modo escuro
        themeIcon.alt = 'Modo claro';
        logoImg.src = 'assets/imagens/LOGOTEMAESCURO.png'; // Logo para tema escuro
      } else {
        document.body.classList.remove('dark-mode');
        themeIcon.src = 'assets/imagens/moon.png'; // Ícone de lua no modo claro
        themeIcon.alt = 'Modo escuro';
        logoImg.src = 'assets/imagens/LOGOSEMFUNDO.png'; // Logo para tema claro
      }
      // Salvar preferência no localStorage
      localStorage.setItem('darkMode', dark ? 'enabled' : 'disabled');
      updateSenhaIcon();
    }
    // Inicializar com tema salvo ou padrão
    const savedTheme = localStorage.getItem('darkMode');
    const isDarkMode = savedTheme === 'enabled';
    setTheme(isDarkMode);
    themeBtn.addEventListener('click', function() {
      const isDark = document.body.classList.contains('dark-mode');
      setTheme(!isDark);
    });

    // Função para atualizar o ícone do olho conforme o tema e estado da senha
    function updateSenhaIcon() {
      var senhaInput = document.getElementById('senha');
      var senhaIcon = document.getElementById('senhaIcon');
      if (!senhaInput || !senhaIcon) return;
      if (senhaInput.type === 'password') {
        if (document.body.classList.contains('dark-mode')) {
          senhaIcon.src = 'assets/imagens/OLHOESCURO.png';
          senhaIcon.style.filter = 'invert(1)';
        } else {
          senhaIcon.src = 'assets/imagens/OLHO.jpg';
          senhaIcon.style.filter = '';
        }
        senhaIcon.alt = 'Senha oculta';
      } else {
        if (document.body.classList.contains('dark-mode')) {
          senhaIcon.src = 'assets/imagens/FECHADOESCURO.png';
          senhaIcon.style.filter = 'invert(1)';
        } else {
          senhaIcon.src = 'assets/imagens/FECHADO.jpg';
          senhaIcon.style.filter = '';
        }
        senhaIcon.alt = 'Senha visível';
      }
    }
  </script>
  <link rel="stylesheet" href="../pages/inicial.html">
  <!-- Script de transição Apple removido -->
  
</body>
</html>
