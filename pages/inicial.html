<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial</title>
  <link rel="stylesheet" href="../css/inicial.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="logo"></span>
      <h1>Plataforma Escolar</h1>
    </div>
    <form method="POST">
      <button type="submit" name="logout" class="logout-button">
        <a href="../login.html">Sair</a>
      </button>
    </form>
  </header>

  <aside class="sidebar">
    <img src="../assets/imagens/mapa.png" alt="Mapa" id="mapButton">
    <span>Mini Mapa</span>

    <div class="options" id="optionsMenu">
      <button onclick="window.location.href='tour.html?bloco=A'">Bloco A</button>
      <button onclick="window.location.href='tour.html?bloco=B'">Bloco B</button>
      <button onclick="window.location.href='tour.html?bloco=D'">Bloco D</button>
      <button onclick="window.location.href='tour.html?bloco=INFANTIL'">Infantil</button>
    </div>
  </aside>

  <main class="content">
    <section class="welcome">
      <h2>Bem-vindo à plataforma escolar</h2>
      <p>Selecione uma opção na barra lateral para começar.</p>
    </section>
  </main>

  <script src="/js/inicial.js"></script>
</body>
</html>
