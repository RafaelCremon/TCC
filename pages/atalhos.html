<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Edição de Atalhos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .atalhos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 32px;
      background: #fff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .atalho-slot {
      background: #f0f3fa;
      border: 2px dashed #b3b8c7;
      border-radius: 12px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #888;
      position: relative;
      transition: background 0.3s, border 0.3s;
      padding: 12px 4px;
    }
    .atalho-slot.preenchido {
      background: #e6eaff;
      border: 2px solid #0057ff;
      color: #222;
    }
    .atalho-slot .remover {
      position: absolute;
      top: 6px;
      right: 8px;
      background: #fff;
      border: none;
      color: #ff6b6b;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: background 0.2s;
    }
    .atalho-slot .remover:hover {
      background: #ffeaea;
    }
    .opcoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .opcao-atalho {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      font-size: 15px;
      color: #222;
      justify-content: space-between;
    }
    .opcao-atalho button {
      background: #f0f3fa;
      border: 1px solid #0057ff;
      color: #0057ff;
      border-radius: 6px;
      font-size: 18px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .opcao-atalho button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .salvar-btn {
      background: linear-gradient(135deg, #0057ff 60%, #00e0ff 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
      float: right;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.2s;
    }
    .salvar-btn:hover {
      background: linear-gradient(135deg, #0037aa 60%, #00b8cc 100%);
    }
    .voltar-btn {
      background: #fff;
      color: #0057ff;
      border: 1px solid #0057ff;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background 0.2s, color 0.2s;
    }
    .voltar-btn:hover {
      background: #e6eaff;
      color: #0037aa;
    }
    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin: 28px 0 10px 0;
      color: #0057ff;
    }

    /* --- MODO ESCURO IRADO --- */
    body.dark-mode {
      --bg-1: #181c2f;
      --bg-2: #232a4d;
      --card: #232a4d;
      --ink: #f1f1f1;
      --muted: #8fa2d9;
      --brand: #7f5cff;
      --brand-2: #00e0ff;
      --ring: #3a4a7a;
      --shadow: 0 24px 48px rgba(0,0,0,.45);
      background:
        radial-gradient(1200px 600px at 10% -10%, #2e1a47 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 60%);
      color: var(--ink);
    }
    body.dark-mode .atalhos-grid {
      background: linear-gradient(135deg, #232a4d 80%, #2e1a47 100%);
    }
    body.dark-mode .atalho-slot {
      background-color: #232a4d;
      border-color: #7f5cff;
      color: #f1f1f1;
    }
    body.dark-mode .atalho-slot.preenchido {
      background-color: #2e1a47;
      border-color: #00e0ff;
    }
    body.dark-mode .atalho-slot .remover {
      background: #3a4a7a;
      color: #ff6b6b;
    }
    body.dark-mode .opcao-atalho {
      background-color: #232a4d;
      color: #f1f1f1;
    }
    body.dark-mode .opcao-atalho span {
      color: #00e0ff;
    }
    body.dark-mode .opcao-atalho button {
      background-color: #232a4d;
      color: #00e0ff;
      border: 1px solid #00e0ff;
    }
    body.dark-mode .opcao-atalho button:disabled {
      opacity: 0.5;
    }
    body.dark-mode .salvar-btn {
      background: linear-gradient(135deg, #7f5cff 60%, #00e0ff 100%);
      color: #fff;
    }
    body.dark-mode .section-title {
      color: #00e0ff;
    }
    body.dark-mode .voltar-btn {
      background: #232a4d;
      color: #00e0ff;
      border: 1px solid #00e0ff;
    }
  </style>
</head>
<body class="page-enter">
  <script>
    // Aplica o tema salvo ANTES de qualquer renderização
    if(localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <button class="voltar-btn" id="voltarBtn" onclick="window.location.href='inicial.html'">Voltar</button>
  <button class="salvar-btn" id="salvarAtalhosBtn">Salvar</button>
  <h1>Edição de atalhos</h1>
  <p>Adicione, remova e ordene os seus atalhos favoritos.</p>

  <div class="section-title">Selecionados <span id="contadorSelecionados" style="font-weight: normal;">0 de 6</span></div>
  <div class="atalhos-grid" id="slots"></div>

  <div class="section-title">Atalhos:</div>
  <div class="opcoes-grid" id="opcoes"></div>

  <script>
    // Exemplo de atalhos disponíveis
    const opcoesDisponiveis = [
      { nome: "Mini Mapa", src: "../assets/imagens/mapa.png", alt: "Mini Mapa" },
      { nome: "Acadêmico", src: "../assets/imagens/desempenho.png", alt: "Acadêmico" },
      { nome: "Preferências", src: "../assets/imagens/preferencias.png", alt: "Preferências" },
      { nome: "Financeiro", src: "../assets/imagens/financeiro.png", alt: "Financeiro" },
      { nome: "Lanchonetes", src: "../assets/imagens/lanchonetes.png", alt: "Lanchonetes" }
    ];

    // Inicializa slots e opções
    const slotsContainer = document.getElementById('slots');
    const opcoesContainer = document.getElementById('opcoes');
    const contador = document.getElementById('contadorSelecionados');

    // Carrega atalhos salvos
    function carregarAtalhosSelecionados() {
      const salvos = JSON.parse(localStorage.getItem('atalhosSelecionados')) || [];
      slotsContainer.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const atalho = salvos[i];
        const slot = document.createElement('div');
        slot.className = 'atalho-slot' + (atalho && atalho.nome ? ' preenchido' : ' vazio');
        if (atalho && atalho.nome) {
          slot.innerHTML = `
            <button class="remover" title="Remover">−</button>
            <img src="${atalho.src}" alt="${atalho.alt}" style="width:32px; height:32px; margin-bottom:4px;">
            <div class="nome">${atalho.nome}</div>
          `;
        } else {
          slot.textContent = 'Escolha uma opção';
        }
        slotsContainer.appendChild(slot);
      }
      atualizarContador();
    }

    // Carrega opções de atalhos
    function carregarOpcoes() {
      opcoesContainer.innerHTML = '';
      opcoesDisponiveis.forEach(opcao => {
        const opcaoDiv = document.createElement('div');
        opcaoDiv.className = 'opcao-atalho';
        opcaoDiv.dataset.nome = opcao.nome;
        opcaoDiv.dataset.src = opcao.src;
        opcaoDiv.dataset.alt = opcao.alt;
        opcaoDiv.innerHTML = `
          <span>${opcao.nome}</span>
          <button title="Adicionar">+</button>
        `;
        opcoesContainer.appendChild(opcaoDiv);
      });
      atualizarBotoes();
    }

    // Atualiza contador de selecionados
    function atualizarContador() {
      const preenchidos = document.querySelectorAll('.atalho-slot.preenchido').length;
      contador.textContent = `${preenchidos} de 6`;
    }

    // Atualiza estado dos botões de adicionar
    function atualizarBotoes() {
      const slots = document.querySelectorAll('.atalho-slot.preenchido .nome');
      const nomesSelecionados = Array.from(slots).map(el => el.textContent);
      document.querySelectorAll('.opcao-atalho').forEach(opcao => {
        const botao = opcao.querySelector('button');
        botao.disabled = nomesSelecionados.includes(opcao.dataset.nome) || nomesSelecionados.length >= 6;
      });
    }

    // Adiciona eventos aos botões de adicionar/remover
    function adicionarEventos() {
      // Adicionar
      document.querySelectorAll('.opcao-atalho button').forEach(botao => {
        botao.onclick = function() {
          const nome = this.parentElement.dataset.nome;
          const src = this.parentElement.dataset.src;
          const alt = this.parentElement.dataset.alt;
          // Adiciona no primeiro slot vazio
          const slots = document.querySelectorAll('.atalho-slot');
          for (let slot of slots) {
            if (!slot.classList.contains('preenchido')) {
              slot.classList.add('preenchido');
              slot.innerHTML = `
                <button class="remover" title="Remover">−</button>
                <img src="${src}" alt="${alt}" style="width:32px; height:32px; margin-bottom:4px;">
                <div class="nome">${nome}</div>
              `;
              break;
            }
          }
          atualizarContador();
          atualizarBotoes();
          adicionarEventos();
        };
      });
      // Remover
      document.querySelectorAll('.atalho-slot.preenchido .remover').forEach(botao => {
        botao.onclick = function() {
          const slot = this.parentElement;
          slot.className = 'atalho-slot vazio';
          slot.textContent = 'Escolha uma opção';
          atualizarContador();
          atualizarBotoes();
          adicionarEventos();
        };
      });
    }

    // Salvar atalhos
    document.getElementById('salvarAtalhosBtn').onclick = function() {
      const slots = document.querySelectorAll('.atalho-slot');
      const atalhos = Array.from(slots).map(slot => {
        if (slot.classList.contains('preenchido')) {
          return {
            nome: slot.querySelector('.nome').textContent,
            src: slot.querySelector('img').getAttribute('src'),
            alt: slot.querySelector('img').getAttribute('alt')
          };
        } else {
          return null;
        }
      });
      
      localStorage.setItem('atalhosSelecionados', JSON.stringify(atalhos));
      window.location.href = 'inicial.html';
    };

    // Inicialização
    carregarAtalhosSelecionados();
    carregarOpcoes();
    adicionarEventos();

    // Sempre que atualizar slots/opções, reatribua eventos
    slotsContainer.addEventListener('DOMSubtreeModified', adicionarEventos);
    opcoesContainer.addEventListener('DOMSubtreeModified', adicionarEventos);
  </script>
</body>
</html>
